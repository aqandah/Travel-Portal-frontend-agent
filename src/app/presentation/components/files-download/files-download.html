<div class="files-download" [class.files-download--horizontal]="horizontal()">
  <small class="files-download__title text-muted fw-semibold">Downloads</small>
  <div class="files-download__links">
    @for (file of data(); track $index) {
      <a [href]="file.url" target="_blank" class="btn btn-light btn-sm text-start border">
        <i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i>{{ file.label }}
      </a>
    }
  </div>
</div>
