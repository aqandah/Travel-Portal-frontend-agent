<div
  class="member-modal-backdrop modal d-block"
  tabindex="-1"
  style="background-color: rgba(0, 0, 0, 0.5)"
  (click)="cancel()"
>
  <div
    class="member-modal-dialog modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"
    (click)="$event.stopPropagation()"
  >
    <div class="member-modal-content modal-content">
      <div class="member-modal-header modal-header">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-person-fill fs-4 text-primary"></i>
          <h5 class="modal-title mb-0">
            {{ memberIndex !== undefined ? 'Edit Member #' + (memberIndex + 1) : 'Add New Member' }}
          </h5>
        </div>
        <button type="button" class="btn-close" (click)="cancel()"></button>
      </div>

      <div class="member-modal-body modal-body">
        <form [formGroup]="memberForm">
          <!-- Personal Information (English) -->
          <h6 class="member-section-title text-primary fw-semibold mb-3">
            <i class="bi bi-person me-2"></i>Personal Information (English)
          </h6>
          <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
              <app-form-text-input label="First Name" formControlName="firstNameNative">
              </app-form-text-input>
            </div>

            <div class="col-12 col-md-4">
              <app-form-text-input label="Father Name" formControlName="fatherNameNative">
              </app-form-text-input>
            </div>

            <div class="col-12 col-md-4">
              <app-form-text-input label="Family Name" formControlName="lastNameNative">
              </app-form-text-input>
            </div>

            <div class="col-12">
              <app-form-text-input label="Address" formControlName="addressNative">
              </app-form-text-input>
            </div>
          </div>

          <!-- Personal Information (Arabic) -->
          <!-- <h6 class="text-primary fw-semibold mb-3">
            <i class="bi bi-translate me-2"></i>Personal Information (Arabic)
          </h6>
          <div class="row g-3 mb-4">
            <div class="col-4">
              <app-form-text-input label="First Name (Arabic)" formControlName="firstNameForeign">
              </app-form-text-input>
            </div>

            <div class="col-4">
              <app-form-text-input label="Father Name (Arabic)" formControlName="fatherNameForeign">
              </app-form-text-input>
            </div>

            <div class="col-4">
              <app-form-text-input label="Family Name (Arabic)" formControlName="lastNameForeign">
              </app-form-text-input>
            </div>

            <div class="col-12">
              <app-form-text-input label="Address (Arabic)" formControlName="addressForeign">
              </app-form-text-input>
            </div>
          </div> -->
          <!-- Arabic Information Toggle -->
          <div
            class="member-arabic-toggle d-flex align-items-center justify-content-between py-3 mb-3"
          >
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-translate text-primary"></i>
              <span class="fw-semibold">Personal Information (Arabic)</span>
              <span class="badge bg-secondary">Optional</span>
            </div>

            <button
              type="button"
              class="btn btn-sm btn-outline-primary d-flex align-items-center gap-2"
              (click)="toggleArabicFields()"
            >
              {{ showArabicFields ? 'Hide Fields' : 'Show Fields' }}

              <i
                class="bi"
                [class.bi-chevron-down]="!showArabicFields"
                [class.bi-chevron-up]="showArabicFields"
              ></i>
            </button>
          </div>

          <!-- Arabic Fields -->
          <div class="collapse" [class.show]="showArabicFields">
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-4">
                <app-form-text-input
                  label="First Name (Arabic)"
                  formControlName="firstNameForeign"
                />
              </div>

              <div class="col-12 col-md-4">
                <app-form-text-input
                  label="Father Name (Arabic)"
                  formControlName="fatherNameForeign"
                />
              </div>

              <div class="col-12 col-md-4">
                <app-form-text-input
                  label="Family Name (Arabic)"
                  formControlName="lastNameForeign"
                />
              </div>

              <div class="col-12">
                <app-form-text-input label="Address (Arabic)" formControlName="addressForeign" />
              </div>
            </div>
          </div>

          <!-- Contact & Identity -->
          <h6 class="member-section-title text-primary fw-semibold mb-3">
            <i class="bi bi-card-text me-2"></i>Contact & Identity
          </h6>
          <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
              <!-- <app-form-text-input
                label="Phone Number"
                inputType="tel"
                formControlName="phoneNumber"
              >
              </app-form-text-input> -->

              <app-phone-number-input-field
                label="Phone Number"
                formControlName="phoneNumber"
                [defaultCountry]="'PS'"
              />
            </div>

            <div class="col-12 col-md-4">
              <app-form-text-input label="Fax Number" inputType="tel" formControlName="fax">
              </app-form-text-input>
            </div>

            <div class="col-12 col-md-4">
              <app-form-text-input
                label="Passport ID"
                formControlName="passportNumber"
                [uppercase]="true"
              >
              </app-form-text-input>
            </div>

            <div class="col-12 col-md-4">
              <app-form-text-input
                label="Date of Birth"
                inputType="date"
                formControlName="birthDate"
                [max]="maxDateOfBirth"
              >
              </app-form-text-input>
            </div>

            <div class="col-12 col-md-4">
              <app-form-text-input
                label="Nationality"
                formControlName="nationalityCountryCode"
                [options]="countries"
              >
              </app-form-text-input>
            </div>

            <div class="col-12 col-md-4">
              <app-form-text-input
                label="Gender"
                formControlName="passengerGender"
                [options]="genders"
              >
              </app-form-text-input>
            </div>
          </div>

          <!-- Coverage Add-ons -->
          <h6 class="member-section-title text-primary fw-semibold mb-3">
            <i class="bi bi-shield-check me-2"></i>Optional Coverage Add-ons
          </h6>
          <div class="row g-2">
            <div class="col-12">
              <ul class="coverage-list list-group">
                <li class="list-group-item">
                  <label class="coverage-option" for="groupTripCancellation">
                    <input
                      class="form-check-input mt-0"
                      type="checkbox"
                      id="groupTripCancellation"
                      formControlName="tripCancellationFlag"
                    />
                    <span>Trip Cancellation · Up to USD 5,000</span>
                  </label>
                </li>

                <li class="list-group-item">
                  <label class="coverage-option" for="groupWinterSki">
                    <input
                      class="form-check-input mt-0"
                      type="checkbox"
                      id="groupWinterSki"
                      formControlName="winterSkiFlag"
                    />
                    <span>Winter Ski / Summer Sports</span>
                  </label>
                </li>

                <li class="list-group-item">
                  <label class="coverage-option" for="groupCovid">
                    <input
                      class="form-check-input mt-0"
                      type="checkbox"
                      id="groupCovid"
                      formControlName="covidFlag"
                    />
                    <span>COVID-19 Coverage · Up to EUR 30,000</span>
                  </label>
                </li>
              </ul>
            </div>
          </div>
        </form>
      </div>

      <div class="member-modal-footer modal-footer">
        <button type="button" class="member-action-button btn btn-outline-secondary" (click)="cancel()">
          <i class="bi bi-x-lg me-1"></i> Cancel
        </button>
        <button type="button" class="member-action-button btn btn-primary" (click)="saveMember()">
          <i class="bi bi-check-lg me-1"></i>
          {{ memberIndex !== undefined ? 'Update Member' : 'Add Member' }}
        </button>
      </div>
    </div>
  </div>
</div>
